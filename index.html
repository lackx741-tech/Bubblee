<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Connect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <h1>My Wallet App</h1>
    <p class="subtitle">Connect your wallet to test the app functionality</p>

    <button id="openModalBtn" class="connect-btn">Connect Wallet</button>

    <div id="walletInfo" class="wallet-info hidden">
      <p><strong>Connected Address:</strong></p>
      <p id="walletAddress">-</p>
      <p><strong>Network:</strong></p>
      <p id="walletNetwork">-</p>
      <button id="disconnectBtn" class="disconnect-btn">Disconnect</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span class="help-icon">?</span>
        <h2>Connect Wallet</h2>
        <span id="closeModalBtn" class="close-icon">&times;</span>
      </div>

      <input type="email" id="emailInput" class="email-input" placeholder="Email (optional)">

      <div class="divider"><span>or</span></div>

      <div class="wallet-list" id="walletList">
        <!-- Wallet options are generated by app.js so you can edit the list easily -->
      </div>

      <p class="terms">
        By connecting your wallet, you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </p>
    </div>
  </div>

  <!-- WalletConnect / Ethers libraries loaded from CDN, no build tools needed -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.13.0/dist/index.umd.js"></script>

  <script src="app.js"></script>
</body>
</html>
